<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazypad</title>
<style>
  :root {
    --bg: #0b0c12;
    --glass: rgba(255,255,255,.055);
    --glass-hi: rgba(255,255,255,.09);
    --stroke: rgba(255,255,255,.08);
    --text: rgba(255,255,255,.88);
    --dim: rgba(255,255,255,.45);
    --ok: #5eead4; --warn: #fbbf24; --q: #a78bfa; --fail: #fb7185;
    --blob1: #6d5dfc; --blob2: #22d3ee; --blob3: #f472b6;
    --shadow: 0 8px 32px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5fa; --glass: rgba(255,255,255,.55); --glass-hi: rgba(255,255,255,.8);
      --stroke: rgba(20,20,40,.07); --text: rgba(15,16,30,.88); --dim: rgba(15,16,30,.45);
      --ok: #0d9488; --warn: #d97706; --q: #7c3aed; --fail: #e11d48;
      --shadow: 0 8px 32px rgba(40,40,90,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Mac uygulamasında zemin gerçek cam: sayfa saydam olur */
  .native body { background: transparent; }
  .native .blobs { display: none; }
  .native .glass { box-shadow: none; }

  .blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blobs i {
    position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%;
    filter: blur(90px); opacity: .22; animation: drift 28s ease-in-out infinite alternate;
  }
  .blobs i:nth-child(1) { background: var(--blob1); top: -18vmax; left: -12vmax; }
  .blobs i:nth-child(2) { background: var(--blob2); bottom: -22vmax; right: -14vmax; animation-delay: -9s; }
  .blobs i:nth-child(3) { background: var(--blob3); top: 30%; left: 55%; width: 30vmax; height: 30vmax; opacity: .12; animation-delay: -17s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }

  .glass {
    background: var(--glass); border: 1px solid var(--stroke); box-shadow: var(--shadow);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
  }

  /* ---------- üst çubuk: küre · sekmeler · düğmeler ---------- */
  .top {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 6px; padding: 6px;
    border-radius: 999px; width: min(640px, calc(100% - 24px));
  }
  .native .top { top: 4px; }
  .orb {
    width: 14px; height: 14px; border-radius: 50%; flex: none; margin: 0 6px;
    background: radial-gradient(circle at 35% 35%, #fff, var(--blob1) 60%);
  }
  .orb.off { filter: grayscale(1); opacity: .35; }
  .orb.speaking { animation: talk 1s ease-in-out infinite; }
  @keyframes talk {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(109,93,252,.45); }
    50% { transform: scale(1.25); box-shadow: 0 0 0 10px rgba(109,93,252,0); }
  }
  .tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border: 0; border-radius: 999px; background: transparent; color: var(--dim);
    font: inherit; font-size: 13.5px; cursor: pointer; transition: background .2s, color .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--glass-hi); color: var(--text); }
  .tab .st { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); opacity: .5; }
  .tab.working .st { background: var(--q); opacity: 1; animation: blink 1.2s infinite; }
  .tab.waiting .st { background: var(--warn); opacity: 1; box-shadow: 0 0 8px var(--warn); }
  .tab .badge {
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; font-size: 11px; line-height: 17px;
    text-align: center; background: var(--q); color: #fff; display: none;
  }
  .tab .badge.on { display: inline-block; }
  .ibtn {
    flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
    background: transparent; color: var(--text); display: grid; place-items: center; transition: background .2s, color .2s;
  }
  .ibtn:hover { background: var(--glass-hi); }
  .ibtn.on { color: var(--q); }
  .ibtn svg { width: 17px; height: 17px; }
  .only-native { display: none; }
  .native .only-native { display: grid; }

  /* ---------- durum çipi ---------- */
  .status {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 9;
    font-size: 12.5px; color: var(--dim); padding: 4px 12px; border-radius: 999px; cursor: pointer;
    white-space: nowrap; max-width: calc(100% - 40px); overflow: hidden; text-overflow: ellipsis;
    transition: opacity .3s;
  }
  .native .status { top: 52px; }
  .status:empty { opacity: 0; pointer-events: none; }

  /* ---------- açılır paneller ---------- */
  .pop {
    position: fixed; top: 92px; left: 50%; z-index: 11; width: min(340px, calc(100% - 32px));
    border-radius: 18px; padding: 14px 16px;
    opacity: 0; pointer-events: none; transform: translate(-50%, -6px); transition: .25s ease;
  }
  .native .pop { background: rgba(30,30,40,.75); }
  .pop { background: color-mix(in srgb, var(--bg) 82%, transparent); }
  .pop.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .pop h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .pop h3 + * { margin-bottom: 4px; }
  .pop .sec + .sec { margin-top: 14px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 10px; align-items: center; padding: 4px 0; font-size: 14px; }
  .steps li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .steps li.done { color: var(--dim); }
  .steps li.done::before { background: var(--ok); }
  .steps li.fail::before { background: var(--fail); }
  .steps li.doing::before { background: var(--q); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  select {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--stroke);
    background: var(--glass-hi); color: var(--text); font: inherit; font-size: 14px;
  }
  .keys { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
  kbd {
    font: 11px/1 ui-monospace, "SF Mono", monospace; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--stroke); background: var(--glass-hi); color: var(--text);
  }
  .seg { display: flex; gap: 4px; background: var(--glass); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 13px;
    padding: 6px 4px; border-radius: 8px; cursor: pointer;
  }
  .seg button.on { background: var(--glass-hi); color: var(--text); }

  /* ---------- akış ---------- */
  main { position: relative; z-index: 1; }
  .feed {
    max-width: 640px; margin: 0 auto; padding: 100px 16px 40vh;
    display: none; flex-direction: column; gap: 12px;
  }
  .native .feed { padding-top: 90px; }
  .feed.active { display: flex; }
  .card {
    border-radius: 20px; padding: 14px 18px; position: relative;
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both; transition: opacity .4s;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .card.old { opacity: .5; }
  .card.old:hover { opacity: 1; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: none; background: var(--ok); }
  .warn .dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .time { font-size: 11px; color: var(--dim); }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  .replay {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--glass-hi); color: var(--text); display: grid; place-items: center;
    opacity: .5; transition: opacity .2s, transform .2s;
  }
  .replay svg { width: 12px; height: 12px; margin-left: 2px; }
  .card:hover .replay { opacity: 1; }
  .replay:hover { transform: scale(1.08); }
  .card.playing .replay { opacity: 1; background: var(--q); color: #fff; }

  .prompt { align-self: flex-end; max-width: 85%; background: color-mix(in srgb, var(--q) 16%, transparent); border-color: transparent; box-shadow: none; padding: 10px 16px; }
  .prompt .body { white-space: pre-wrap; }

  .activity { padding: 10px 18px; box-shadow: none; }
  .activity .sum { font-size: 13.5px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font: 12px/1 ui-monospace, "SF Mono", monospace; padding: 5px 9px; border-radius: 8px;
    background: var(--glass-hi); color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .draw .title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .draw .mer { overflow-x: auto; display: flex; justify-content: center; padding: 4px 0; }
  .draw svg { max-width: 100%; height: auto; }
  .draw .mer { cursor: zoom-in; }
  .zoom {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; cursor: zoom-out;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: rise .25s both;
  }
  .zoom svg { width: min(1400px, 100%) !important; max-width: none !important; height: auto; max-height: 100%; }
  .draw pre { color: var(--fail); white-space: pre-wrap; font-size: 12px; margin: 0; }

  .ask, .attn { border-color: color-mix(in srgb, var(--q) 45%, transparent); }
  .attn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .ask::after, .attn::after {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
    box-shadow: 0 0 40px -8px var(--q); opacity: .5; animation: glow 2.4s ease-in-out infinite;
  }
  .attn::after { box-shadow: 0 0 40px -8px var(--warn); }
  .attn .dot { background: var(--warn); }
  .ask.answered::after, .attn.resolved::after { display: none; }
  .attn.resolved { border-color: var(--stroke); }
  @keyframes glow { 50% { opacity: .15; } }
  .q { font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .opts button {
    border: 1px solid var(--stroke); background: var(--glass-hi); color: var(--text);
    border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer;
    transition: transform .15s, opacity .3s;
  }
  .opts button:hover { transform: translateY(-1px); }
  .opts button:first-child { background: var(--q); border-color: transparent; color: #fff; }
  .ask.answered .opts button { opacity: .25; pointer-events: none; }
  .ask.answered .opts button.chosen { opacity: 1; }

  .done .dot { background: var(--ok); }
  .link { border: 0; background: none; color: var(--q); font: inherit; font-size: 13px; padding: 4px 0 0; cursor: pointer; }
  .full { display: none; white-space: pre-wrap; font-size: 13.5px; color: var(--dim); margin-top: 8px; max-height: 50vh; overflow: auto; }
  .done.open .full { display: block; }

  /* ---------- show: tablo / grafik / karşılaştırma / noktalar ---------- */
  .show .title { font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  .twrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .t th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--stroke); white-space: nowrap; }
  .t td { padding: 8px 10px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
  .t tr:last-child td { border-bottom: 0; }
  .t .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .cmp { grid-template-columns: 1fr; } }
  .cmp .col { background: var(--glass); border-radius: 14px; padding: 10px 14px; }
  .cmp h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .cmp ul { margin: 0; padding-left: 18px; }
  .cmp li { margin: 4px 0; font-size: 14px; }
  .pts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .pt { background: var(--glass); border-radius: 14px; padding: 10px 14px; }
  .pt .n { font: 600 11px/1 ui-monospace, "SF Mono", monospace; color: var(--q); }
  .pt b { display: block; font-size: 14px; font-weight: 600; margin-top: 6px; }
  .pt span { display: block; font-size: 13px; color: var(--dim); margin-top: 2px; }

  .viz {
    position: relative;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --ring: #f4f5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .viz { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --ring: #15161e; }
  }
  .viz svg { width: 100%; height: auto; display: block; overflow: visible; }
  .viz .ax { fill: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .viz .grid { stroke: var(--stroke); stroke-width: 1; }
  .viz .base { stroke: var(--dim); stroke-opacity: .5; stroke-width: 1; }
  .viz .hair { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .viz .hit { fill: transparent; cursor: default; }
  .viz .end { fill: var(--text); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .tip {
    position: absolute; pointer-events: none; display: none; z-index: 3; min-width: 120px;
    padding: 8px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
    background: color-mix(in srgb, var(--bg) 92%, transparent); border: 1px solid var(--stroke); box-shadow: var(--shadow);
  }
  .tip b { display: block; font-weight: 600; margin-bottom: 2px; }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip .r i { width: 8px; height: 8px; border-radius: 2px; }
  .tip .r em { font-style: normal; margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .viz .tview { display: none; }
  .viz.as-table .tview { display: block; }
  .viz.as-table .chartv { display: none; }

  .hello { text-align: center; color: var(--dim); margin-top: 24vh; animation: rise .8s both; }
  .big-orb {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px;
    background: radial-gradient(circle at 35% 35%, #fff, var(--blob1) 55%, var(--blob2));
    animation: breathe 4s ease-in-out infinite; box-shadow: 0 0 60px -10px var(--blob1);
  }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  .hint { margin-top: 10px; font-size: 13px; }

  /* ---------- alt hap: ses kilidi / kaçırılanlar ---------- */
  .pill {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 11;
    display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px;
    color: var(--text); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
    animation: rise .5s both;
  }
  .pill svg { width: 16px; height: 16px; }
  .pill[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<div class="top glass">
  <div class="orb off" id="orb"></div>
  <div class="tabs" id="tabs"></div>
  <button class="ibtn only-native" id="pinBtn" title="Her zaman üstte" data-icon="pin"></button>
  <button class="ibtn" id="stopBtn" title="Sus  (Esc)" data-icon="stop"></button>
  <button class="ibtn" id="muteBtn" title="Sesi kapat  (M)" data-icon="volume"></button>
  <button class="ibtn" id="setBtn" title="Ayarlar" data-icon="more"></button>
</div>
<div class="status glass" id="status"></div>

<div class="pop glass" id="stepsPop">
  <h3>Adımlar</h3>
  <ul class="steps" id="steps"></ul>
</div>
<div class="pop glass" id="setPop">
  <div class="sec">
    <h3>Nasıl anlatsın</h3>
    <div class="seg" id="explainSeg">
      <button data-v="visual" title="Çizim, tablo, grafik; sohbette en fazla 3 satır">Görsel</button>
      <button data-v="balanced" title="Yapılı şeyler tahtada, metin kısa">Dengeli</button>
      <button data-v="text" title="Yazıyla açıklasın">Metin</button>
    </div>
  </div>
  <div class="sec">
    <h3>Ne kadar konuşsun</h3>
    <div class="seg" id="talkSeg">
      <button data-v="all">Her şeyi</button>
      <button data-v="important">Önemlileri</button>
      <button data-v="quiet" title="Sadece karar ya da izin gerektiğinde">Gerekince</button>
    </div>
  </div>
  <div class="sec"><h3>Ses</h3><select id="voiceSel"></select></div>
  <div class="sec">
    <h3>Kısayollar</h3>
    <div class="keys">
      <span><kbd>Space</kbd> son mesajı tekrar dinle</span>
      <span><kbd>Esc</kbd> sus</span>
      <span><kbd>M</kbd> sesi aç / kapat</span>
      <span><kbd>1</kbd>–<kbd>4</kbd> karar seçeneğini seç</span>
      <span><kbd>[</kbd> <kbd>]</kbd> sekmeler arasında geç</span>
    </div>
  </div>
</div>

<main id="main">
  <div class="hello" id="hello">
    <div class="big-orb"></div>
    Claude çalışmaya başlayınca<br>burada çizip anlatacak.
    <div class="hint">Her proje kendi sekmesinde görünür.</div>
  </div>
</main>

<button class="pill glass" id="unlock" hidden><span data-icon="volume"></span>Sesi açmak için dokun</button>
<button class="pill glass" id="catchup" hidden><span data-icon="play"></span><span id="catchupText"></span></button>

<script type="module">
const $ = (s) => document.querySelector(s);
const NATIVE = window.webkit?.messageHandlers?.lazypad;
if (NATIVE) document.documentElement.classList.add("native");

// ---------------------------------------------------------------- ikonlar
const P = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  volume: P('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'),
  muted:  P('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>'),
  stop:   P('<rect x="6" y="6" width="12" height="12" rx="2.5"/>'),
  more:   P('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
  pin:    P('<path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2.5 3.2h-11z"/>'),
  play:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
};
for (const el of document.querySelectorAll("[data-icon]")) el.innerHTML = ICON[el.dataset.icon];

// ---------------------------------------------------------------- ayarlar (tarayıcıda hatırlanır)
const store = {
  get(k, d) { try { return localStorage.getItem("lp." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lp." + k, v); } catch {} },
};
let talk = store.get("talk", "important");
for (const b of document.querySelectorAll("#talkSeg button")) {
  b.classList.toggle("on", b.dataset.v === talk);
  b.onclick = () => {
    talk = b.dataset.v; store.set("talk", talk);
    document.querySelectorAll("#talkSeg button").forEach((x) => x.classList.toggle("on", x === b));
  };
}

// Anlatım modu merkezde tutulur, Claude'a her mesajda iletilir
function setExplain(mode) {
  document.querySelectorAll("#explainSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === mode));
}
document.querySelectorAll("#explainSeg button").forEach((b) => {
  b.onclick = () => { setExplain(b.dataset.v); ws?.send(JSON.stringify({ type: "explain", mode: b.dataset.v })); };
});

// ---------------------------------------------------------------- Mermaid (ilk şemada yüklenir)
let mermaidP = null;
const dark = () => !matchMedia("(prefers-color-scheme: light)").matches;
function getMermaid() {
  mermaidP ??= import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs").then(({ default: m }) => {
    m.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      fontFamily: "-apple-system, Inter, system-ui, sans-serif",
      themeVariables: dark() ? {
        background: "transparent", primaryColor: "rgba(255,255,255,0.06)", primaryBorderColor: "rgba(167,139,250,0.55)",
        primaryTextColor: "#e9e9f2", lineColor: "rgba(255,255,255,0.35)", fontSize: "14px", edgeLabelBackground: "transparent",
      } : {
        background: "transparent", primaryColor: "rgba(255,255,255,0.7)", primaryBorderColor: "rgba(124,58,237,0.45)",
        primaryTextColor: "#1a1b2e", lineColor: "rgba(20,20,40,0.35)", fontSize: "14px", edgeLabelBackground: "transparent",
      },
      flowchart: { curve: "basis", padding: 14 },
      themeCSS: ".node rect, .node polygon { rx: 12px; ry: 12px; stroke-width: 1px; }",
    });
    return m;
  });
  return mermaidP;
}

// ---------------------------------------------------------------- ses
const orb = $("#orb"), voiceSel = $("#voiceSel");
let muted = false, unlocked = !!NATIVE, speakSeq = 0;
const speakEls = new Map();
const pendingUnlock = [];

function loadVoices() {
  let list = [];
  if (NATIVE) list = (window.__lpVoices || []).map((v) => ({ id: v.id, name: v.name, lang: v.lang }));
  else { try { list = speechSynthesis.getVoices().map((v) => ({ id: v.name, name: v.name, lang: v.lang })); } catch {} }
  if (!list.length) return;
  list.sort((a, b) => (b.lang.startsWith("tr") - a.lang.startsWith("tr")) || a.name.localeCompare(b.name));
  voiceSel.innerHTML = "";
  for (const v of list) {
    const o = document.createElement("option");
    o.value = v.id; o.textContent = `${v.name} · ${v.lang}`;
    voiceSel.appendChild(o);
  }
  const saved = store.get("voice", "");
  if (list.some((v) => v.id === saved)) voiceSel.value = saved;
}
loadVoices();
if (!NATIVE) { try { speechSynthesis.onvoiceschanged = loadVoices; } catch {} }
voiceSel.onchange = () => store.set("voice", voiceSel.value);

function setPlaying(id, on, anySpeaking) {
  const el = speakEls.get(id);
  el?.classList.toggle("playing", on);
  if (!on) speakEls.delete(id);
  orb.classList.toggle("speaking", anySpeaking);
}
window.__lpSpeech = (on, id, any) => setPlaying(id, on, any);

function speak(text, el) {
  if (muted || !text) return;
  if (!unlocked) { pendingUnlock.length = 0; pendingUnlock.push([text, el]); $("#unlock").hidden = false; return; }
  const id = "s" + (++speakSeq);
  if (el) speakEls.set(id, el);
  if (NATIVE) return NATIVE.postMessage({ cmd: "speak", text, voice: voiceSel.value, id });
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find((x) => x.name === voiceSel.value);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "tr-TR";
    u.rate = 1.02;
    u.onstart = () => setPlaying(id, true, true);
    u.onend = u.onerror = () => setPlaying(id, false, speechSynthesis.speaking);
    speechSynthesis.speak(u);
  } catch {}
}
function hush() {
  if (NATIVE) NATIVE.postMessage({ cmd: "stop" });
  else { try { speechSynthesis.cancel(); } catch {} }
  orb.classList.remove("speaking");
  document.querySelectorAll(".playing").forEach((c) => c.classList.remove("playing"));
}
function toggleMute() {
  muted = !muted;
  $("#muteBtn").innerHTML = muted ? ICON.muted : ICON.volume;
  $("#muteBtn").classList.toggle("on", muted);
  if (muted) hush();
}
function unlock() {
  if (unlocked) return;
  unlocked = true;
  $("#unlock").hidden = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
  for (const [t, el] of pendingUnlock.splice(0)) speak(t, el);
}
$("#unlock").onclick = unlock;
document.addEventListener("pointerdown", unlock, { once: true });
document.addEventListener("keydown", unlock, { once: true });
$("#stopBtn").onclick = hush;
$("#muteBtn").onclick = toggleMute;

let pinned = store.get("pinned", "0") === "1";
$("#pinBtn").classList.toggle("on", pinned);
$("#pinBtn").onclick = () => {
  pinned = !pinned; store.set("pinned", pinned ? "1" : "0");
  $("#pinBtn").classList.toggle("on", pinned);
  NATIVE?.postMessage({ cmd: "pin", on: pinned });
};

// ---------------------------------------------------------------- sekmeler
const tabs = new Map(); // key -> { key, name, state, btn, feed, steps, current, unread[] }
let active = null;

function ensureTab(t) {
  let tab = tabs.get(t.key);
  if (!tab) {
    $("#hello")?.remove();
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.innerHTML = `<span class="st"></span><span class="nm"></span><span class="badge"></span>`;
    btn.onclick = () => activate(t.key);
    $("#tabs").appendChild(btn);
    const feed = document.createElement("div");
    feed.className = "feed";
    $("#main").appendChild(feed);
    tab = { key: t.key, name: t.name || "Claude", state: "idle", btn, feed, steps: new Map(), current: null, unread: [], cards: new Map() };
    tabs.set(t.key, tab);
    if (!active) activate(t.key);
  }
  if (t.name) tab.name = t.name;
  if (t.state) tab.state = t.state;
  tab.btn.querySelector(".nm").textContent = tab.name;
  tab.btn.className = "tab " + tab.state + (tab.key === active ? " active" : "");
  tab.btn.title = tab.key;
  return tab;
}

function activate(key) {
  active = key;
  for (const t of tabs.values()) {
    t.feed.classList.toggle("active", t.key === key);
    t.btn.classList.toggle("active", t.key === key);
  }
  const t = tabs.get(key);
  t.btn.scrollIntoView({ inline: "nearest", block: "nearest" });
  renderSteps(); renderCatchup();
  t.feed.lastElementChild?.scrollIntoView({ block: "end" });
}

function setUnread(t) {
  const b = t.btn.querySelector(".badge");
  b.textContent = t.unread.length;
  b.classList.toggle("on", t.unread.length > 0);
}

function renderCatchup() {
  const t = tabs.get(active);
  const n = t?.unread.length || 0;
  $("#catchup").hidden = n === 0;
  $("#catchupText").textContent = `Kaçırdıkların (${n}) · Dinle`;
}
$("#catchup").onclick = () => {
  const t = tabs.get(active);
  hush();
  for (const u of t.unread.splice(0)) speak(u.text, u.el);
  setUnread(t); renderCatchup();
};

// ---------------------------------------------------------------- adımlar
function renderSteps() {
  const t = tabs.get(active);
  const ul = $("#steps");
  ul.innerHTML = "";
  if (!t || !t.steps.size) { $("#status").textContent = ""; ul.innerHTML = `<li class="done">Henüz adım yok</li>`; return; }
  for (const [label, status] of t.steps) {
    const li = document.createElement("li");
    li.className = status; li.textContent = label;
    ul.appendChild(li);
  }
  const done = [...t.steps.values()].filter((s) => s === "done").length;
  $("#status").textContent = t.current ? `${t.current}…  ${done}/${t.steps.size}` : `${done}/${t.steps.size} adım tamam`;
}

// ---------------------------------------------------------------- kartlar
const fmt = (t) => new Date(t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const replayBtn = `<button class="replay" title="Tekrar dinle  (Space)">${ICON.play}</button>`;

function addCard(tab, ev, cls, html, sayText) {
  let d = ev.id && tab.cards.get(ev.id);
  const isNew = !d;
  if (isNew) {
    d = document.createElement("div");
    tab.feed.appendChild(d);
    if (ev.id) tab.cards.set(ev.id, d);
  }
  d.className = "card glass " + cls;
  d.innerHTML = html;
  if (sayText) {
    d.dataset.say = sayText;
    d.querySelector(".replay")?.addEventListener("click", () => { hush(); speak(sayText, d); });
  }
  if (isNew) {
    // Yeni mesaj gelince önceki turun kartları soluklaşır; aynı cevabın görselleri parlak kalır
    if (cls === "prompt") tab.feed.querySelectorAll(".card").forEach((c) => { if (c !== d && !c.matches(".ask:not(.answered)")) c.classList.add("old"); });
    tab.feed.querySelectorAll(".attn:not(.resolved)").forEach((c) => { if (c !== d) c.classList.add("resolved"); });
    if (tab.key === active) requestAnimationFrame(() => d.scrollIntoView({ behavior: "smooth", block: "end" }));
  }
  return d;
}

/** Konuşma politikası: aktif sekme ve "ne kadar konuşsun" ayarına göre */
function announce(tab, el, text, kind, live) {
  if (!live) return;
  const levels = { all: ["say", "warn", "done", "attn", "ask"], important: ["warn", "done", "attn", "ask"], quiet: ["attn", "ask"] };
  const allowed = levels[talk].includes(kind);
  if (tab.key === active) { if (allowed) speak(text, el); return; }
  tab.unread.push({ text, el });
  setUnread(tab);
  if (kind === "attn" || kind === "ask") speak(`${tab.name}: ${kind === "ask" ? "bir kararın var" : "seni bekliyor"}`);
  else if (kind === "done" && talk !== "quiet") speak(`${tab.name} bitti`);
}

function handle(ev, live = true) {
  if (ev.type === "explain") return setExplain(ev.mode);
  if (ev.type === "backlog") {
    if (ev.explain) setExplain(ev.explain);
    for (const t of ev.tabs) ensureTab(t);
    for (const e of ev.events) handle(e, false);
    return;
  }
  if (ev.type === "tab") return void ensureTab(ev.tab);
  const tab = ensureTab({ key: ev.tab || "claude" });

  switch (ev.type) {
    case "prompt":
      addCard(tab, ev, "prompt", `<div class="body">${esc(ev.text)}</div>`);
      tab.steps.clear(); tab.current = null; if (tab.key === active) renderSteps();
      break;

    case "activity": {
      const parts = [];
      if (ev.files.length) parts.push(`${ev.files.length} dosya değişti`);
      if (ev.cmds) parts.push(`${ev.cmds} komut çalıştı`);
      const chips = ev.files.slice(-8).map((f) => `<span class="chip" title="${esc(f)}">${esc(f.split("/").pop())}</span>`).join("");
      const more = ev.files.length > 8 ? `<span class="chip">+${ev.files.length - 8}</span>` : "";
      addCard(tab, ev, "activity", `<div class="sum">${parts.join(" · ")}</div>${chips || more ? `<div class="chips">${chips}${more}</div>` : ""}`);
      break;
    }

    case "say": {
      const warn = ev.level === "warn";
      const d = addCard(tab, ev, "say" + (warn ? " warn" : ""), `
        <div class="row"><div class="dot"></div>
          <div class="body">${esc(ev.text)}<div class="time">${fmt(ev.at)}</div></div>${replayBtn}</div>`, ev.text);
      announce(tab, d, ev.text, warn ? "warn" : "say", live);
      break;
    }

    case "draw": {
      const d = addCard(tab, ev, "draw", `<div class="title">${esc(ev.title)}</div><div class="mer"></div><div class="time">${fmt(ev.at)}</div>`);
      getMermaid().then((m) => m.render("m" + ev.id.replace(/\W/g, ""), ev.mermaid))
        .then(({ svg }) => {
          const mer = d.querySelector(".mer");
          mer.innerHTML = svg;
          mer.title = "Büyütmek için tıkla";
          mer.onclick = () => {
            const z = document.createElement("div");
            z.className = "zoom"; z.appendChild(mer.querySelector("svg").cloneNode(true));
            z.onclick = () => z.remove();
            document.body.appendChild(z);
          };
        })
        .catch(() => { d.querySelector(".mer").innerHTML = `<pre>${esc(ev.mermaid)}</pre>`; });
      break;
    }

    case "show": {
      const body = renderShow(ev);
      const d = addCard(tab, ev, "show", `<div class="title">${esc(ev.title)}</div>${body}<div class="time">${fmt(ev.at)}</div>`);
      if (ev.kind === "chart") wireChart(d, ev.data);
      break;
    }

    case "step":
      tab.steps.set(ev.label, ev.status);
      if (ev.status === "doing") tab.current = ev.label;
      else if (tab.current === ev.label) tab.current = null;
      if (tab.key === active) renderSteps();
      break;

    case "ask": {
      const d = addCard(tab, ev, "ask", `
        <div class="row"><div class="body">
          <div class="q">${esc(ev.question)}</div>
          <div class="opts">${ev.options.map((o, i) => `<button title="Kısayol: ${i + 1}">${esc(o)}</button>`).join("")}</div>
        </div>${replayBtn}</div>`, ev.question);
      d.querySelectorAll(".opts button").forEach((b, i) => {
        b.onclick = () => {
          ws?.send(JSON.stringify({ type: "answer", id: ev.id, choice: ev.options[i] }));
          markAnswered(tab, ev.id, ev.options[i]);
        };
      });
      announce(tab, d, ev.question, "ask", live);
      break;
    }

    case "answered":
      markAnswered(tab, ev.askId, ev.choice);
      break;

    case "attention": {
      const d = addCard(tab, ev, "attn", `
        <div class="row"><div class="dot"></div>
          <div class="body"><div class="lbl">Seni bekliyor</div>${esc(ev.text)}<div class="time">${fmt(ev.at)}</div></div>${replayBtn}</div>`, ev.text);
      announce(tab, d, ev.text, "attn", live);
      break;
    }

    case "done": {
      const hasMore = ev.full && ev.full.trim() !== ev.summary.trim();
      const d = addCard(tab, ev, "done", `
        <div class="row"><div class="dot"></div>
          <div class="body"><div class="lbl">Bitti</div>${esc(ev.summary)}
            ${hasMore ? `<div class="full">${esc(ev.full)}</div><button class="link">Tamamını göster</button>` : ""}
            <div class="time">${fmt(ev.at)}</div></div>${replayBtn}</div>`, ev.summary);
      d.querySelector(".link")?.addEventListener("click", (e) => {
        const open = d.classList.toggle("open");
        e.target.textContent = open ? "Gizle" : "Tamamını göster";
      });
      // Claude bu turda zaten konuştuysa özeti tekrar okuma, sadece "Bitti" de
      announce(tab, d, ev.said ? "Bitti." : ev.summary, "done", live);
      break;
    }
  }
}

// ---------------------------------------------------------------- show
const isNum = (v) => typeof v === "number" || /^-?[\d.,]+\s*(%|ms|s|mb|kb|gb)?$/i.test(String(v).trim());
const fmtNum = (v) => typeof v === "number" ? v.toLocaleString("tr-TR", { maximumFractionDigits: 2 }) : v;

function tableHTML(columns, rows) {
  const numCol = columns.map((_, i) => rows.length > 0 && rows.every((r) => r[i] === undefined || r[i] === "" || isNum(r[i])));
  return `<div class="twrap"><table class="t"><thead><tr>${columns.map((c, i) => `<th class="${numCol[i] ? "num" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${columns.map((_, i) => `<td class="${numCol[i] ? "num" : ""}">${esc(fmtNum(r[i] ?? ""))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderShow(ev) {
  const d = ev.data || {};
  switch (ev.kind) {
    case "table": return tableHTML(d.columns || [], d.rows || []);
    case "compare": return `<div class="cmp">${[d.left, d.right].map((c) => `<div class="col"><h4>${esc(c?.label)}</h4><ul>${(c?.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
    case "points": return `<div class="pts">${(d.items || []).map((p, i) => `<div class="pt"><div class="n">${String(i + 1).padStart(2, "0")}</div><b>${esc(p.title)}</b>${p.text ? `<span>${esc(p.text)}</span>` : ""}</div>`).join("")}</div>`;
    case "chart": return chartHTML(d);
    default: return "";
  }
}

// Sade SVG grafik: ince işaretler, tek eksen, sönük ızgara, hover ipucu, tablo görünümü
function niceScale(max) {
  if (max <= 0) return { top: 1, step: 0.25 };
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  return { top: step * Math.ceil(max / step), step };
}
function chartHTML(d) {
  const W = 600, H = 230, L = 46, R = d.chart === "line" && d.series.length > 1 ? 70 : 12, T = 10, B = 28;
  const pw = W - L - R, ph = H - T - B, n = d.labels.length, k = d.series.length;
  const all = d.series.flatMap((s) => s.values).filter(Number.isFinite);
  const { top, step } = niceScale(Math.max(0, ...all));
  const y = (v) => T + ph - (Math.max(0, v) / top) * ph;
  const band = pw / n, cx = (i) => L + band * i + band / 2;
  const col = (j) => `var(--s${j + 1})`;
  const u = d.unit ? " " + d.unit : "";
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) {
    g += `<line class="${v === 0 ? "base" : "grid"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
    g += `<text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(+v.toFixed(6))}</text>`;
  }
  const every = Math.ceil(n / 8);
  d.labels.forEach((lb, i) => {
    if (i % every === 0) g += `<text class="ax" x="${cx(i)}" y="${H - 8}" text-anchor="middle">${esc(lb.length > 12 ? lb.slice(0, 11) + "…" : lb)}</text>`;
  });
  let marks = "";
  if (d.chart === "bar") {
    const gap = 2, bw = Math.min(28, (band * 0.72 - gap * (k - 1)) / k);
    d.series.forEach((s, j) => s.values.forEach((v, i) => {
      if (!Number.isFinite(v) || v <= 0) return;
      const x = cx(i) - (bw * k + gap * (k - 1)) / 2 + j * (bw + gap), yt = y(v), yb = y(0), r = Math.min(4, bw / 2, yb - yt);
      marks += `<path fill="${col(j)}" d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yb} Z"/>`;
    }));
  } else {
    d.series.forEach((s, j) => {
      const pts = s.values.map((v, i) => [cx(i), y(v)]);
      marks += `<polyline fill="none" stroke="${col(j)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;
      if (n <= 16) pts.forEach(([px, py]) => { marks += `<circle cx="${px}" cy="${py}" r="4" fill="${col(j)}" stroke="var(--ring)" stroke-width="2"/>`; });
      if (k > 1) { const [ex, ey] = pts[pts.length - 1]; marks += `<text class="end" x="${ex + 10}" y="${ey + 4}">${esc(s.name.length > 9 ? s.name.slice(0, 8) + "…" : s.name)}</text>`; }
    });
  }
  let hits = `<line class="hair" x1="0" x2="0" y1="${T}" y2="${T + ph}"/>`;
  d.labels.forEach((_, i) => { hits += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${ph}"/>`; });
  const legend = k > 1 ? `<div class="legend">${d.series.map((s, j) => `<span><i style="background:${col(j)}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  const rows = d.labels.map((lb, i) => [lb, ...d.series.map((s) => s.values[i])]);
  return `<div class="viz">
    <div class="chartv">${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="grafik">${g}${marks}${hits}</svg><div class="tip"></div></div>
    <div class="tview">${tableHTML(["", ...d.series.map((s) => s.name + u)], rows)}</div>
    <button class="link tbl">Tablo olarak gör</button>
  </div>`;
}
function wireChart(card, d) {
  const viz = card.querySelector(".viz"), svg = viz.querySelector("svg"), tip = viz.querySelector(".tip"), hair = viz.querySelector(".hair");
  const u = d.unit ? " " + d.unit : "";
  viz.querySelector(".tbl").onclick = (e) => {
    const t = viz.classList.toggle("as-table");
    e.target.textContent = t ? "Grafik olarak gör" : "Tablo olarak gör";
  };
  svg.querySelectorAll(".hit").forEach((r) => {
    r.addEventListener("pointerenter", () => {
      const i = +r.dataset.i;
      tip.innerHTML = `<b>${esc(d.labels[i])}</b>` + d.series.map((s, j) =>
        `<div class="r"><i style="background:var(--s${j + 1})"></i>${esc(s.name)}<em>${esc(fmtNum(s.values[i]))}${esc(u)}</em></div>`).join("");
      const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = box.width / vb.width;
      const x = (+r.getAttribute("x") + +r.getAttribute("width") / 2) * sx;
      if (d.chart === "line") { hair.setAttribute("x1", x / sx); hair.setAttribute("x2", x / sx); hair.style.opacity = 1; }
      tip.style.display = "block";
      const left = Math.min(Math.max(0, x + 12), box.width - tip.offsetWidth);
      tip.style.left = left + "px"; tip.style.top = (d.series.length > 1 ? 30 : 6) + "px";
    });
    r.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.style.opacity = 0; });
  });
}

function markAnswered(tab, id, choice) {
  const d = tab.cards.get(id);
  if (!d || d.classList.contains("answered")) return;
  d.classList.add("answered");
  d.querySelectorAll(".opts button").forEach((b) => { if (b.textContent === choice) b.classList.add("chosen"); });
}

// ---------------------------------------------------------------- açılır paneller
function toggle(pop) {
  for (const p of document.querySelectorAll(".pop")) if (p !== pop) p.classList.remove("open");
  pop.classList.toggle("open");
}
$("#status").onclick = () => toggle($("#stepsPop"));
$("#setBtn").onclick = () => toggle($("#setPop"));
document.addEventListener("click", (e) => {
  if (!e.target.closest(".pop, .top, .status")) document.querySelectorAll(".pop").forEach((p) => p.classList.remove("open"));
});

// ---------------------------------------------------------------- kısayollar
document.addEventListener("keydown", (e) => {
  if (e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey) return;
  const t = tabs.get(active);
  if (e.key === "Escape") { const z = document.querySelector(".zoom"); if (z) return z.remove(); hush(); }
  else if (e.key === "m" || e.key === "M") toggleMute();
  else if (e.key === " ") {
    e.preventDefault();
    const last = t && [...t.feed.querySelectorAll(".card[data-say]")].pop();
    if (last) { hush(); speak(last.dataset.say, last); }
  } else if (/^[1-4]$/.test(e.key) && t) {
    const open = [...t.feed.querySelectorAll(".ask:not(.answered)")].pop();
    open?.querySelectorAll(".opts button")[Number(e.key) - 1]?.click();
  } else if ((e.key === "[" || e.key === "]") && tabs.size > 1) {
    const keys = [...tabs.keys()];
    const i = keys.indexOf(active) + (e.key === "]" ? 1 : -1);
    activate(keys[(i + keys.length) % keys.length]);
  }
});

// ---------------------------------------------------------------- bağlantı
let ws = null;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen = () => orb.classList.remove("off");
  ws.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    orb.classList.add("off");
    // Yeniden bağlanınca geçmiş baştan gelir: mevcut sekmeleri temizle
    setTimeout(() => {
      for (const t of tabs.values()) { t.btn.remove(); t.feed.remove(); }
      tabs.clear(); active = null;
      connect();
    }, 1500);
  };
}
connect();
</script>
