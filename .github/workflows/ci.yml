name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mac uygulaması derleniyor mu
        run: >
          xcrun swiftc -O mac/Lazypad.swift -o /tmp/Lazypad
          -framework Cocoa -framework WebKit -framework AVFoundation
